{% extends 'store/base.html' %}

{% block title %}Login - ShopModern{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Login to Your Account</h2>
        
        {% if messages %}
            {% for message in messages %}
            <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded mb-4" role="alert">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}

        <form action="/login/" method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <input type="email" id="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="you@example.com" required>
            </div>
            
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 shadow-sm hover:shadow">
                Login
            </button>
        </form>
        
        <p class="text-center text-sm text-gray-500 mt-6">
            Don't have an account? <a href="/signup/" class="text-indigo-600 hover:text-indigo-800 font-medium">Sign up here</a>
        </p>
    </div>
</div>
{% endblock %}
